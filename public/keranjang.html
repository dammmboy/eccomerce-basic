<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang - DAMMBOYY WEAR</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 text-white font-sans">

  <div class="max-w-5xl mx-auto mt-10 p-6 bg-gray-200 text-black rounded-xl shadow-lg">

    <!-- Header -->
    <div class="flex justify-between items-center bg-black text-white rounded-t-xl px-6 py-4">
      <div class="flex gap-8 items-cnter">
        <a href="homepage.html" class="hover:underline">HOME</a>
      </div>
      <h1 class="text-lg font-bold tracking-wide">Dammboyy Wear</h1>
    </div>

    <!-- Tabel Produk -->
    <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="md:col-span-2">
        <table class="w-full text-sm">
          <thead class="border-b font-semibold">
            <tr>
              <th class="text-left py-2">Produk</th>
              <th>Harga</th>
              <th>Kuantitas</th>
              <th>Total</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="cartItems" class="divide-y">
            <!-- Dinamis dari JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- Ringkasan -->
      <div class="bg-gradient-to-b from-white to-gray-400 text-black rounded-lg p-4 shadow-lg">
        <p class="font-bold mb-2">Total:</p>
        <p class="ringkasan-total font-bold text-xl">Rp 0</p>
        <a href="chekout.html" class="mt-4 block text-center bg-black text-white py-2 rounded hover:bg-gray-700">Beli Sekarang</a>
      </div>
    </div>

  </div>

  <script>
    const cartTable = document.getElementById("cartItems");
    let cartData = JSON.parse(localStorage.getItem("cart")) || [];
    let total = 0;

    function renderCart() {
      cartTable.innerHTML = "";
      total = 0;

      if (cartData.length === 0) {
        cartTable.innerHTML = `<tr><td colspan="5" class="text-center py-4">Keranjang kosong</td></tr>`;
      } else {
        cartData.forEach(item => {
          const itemTotal = item.price * item.qty;
          total += itemTotal;

          const row = document.createElement("tr");
          row.innerHTML = `
            <td class="flex items-center gap-2 py-4">
              <img src="${item.image}" alt="${item.title}" class="w-16 h-16 object-cover rounded" />
              <div><p class="font-semibold">${item.title}</p></div>
            </td>
            <td class="text-red-500 text-center">Rp ${item.price.toFixed(3)}</td>
            <td class="text-center">
              <input type="number" value="${item.qty}" min="1" class="w-12 text-center border rounded qty-input" data-id="${item.id}" />
            </td>
            <td class="text-red-600 text-center">Rp ${itemTotal.toFixed(3)}</td>
            <td class="text-center">
              <button class="text-red-600 font-bold delete-btn" data-id="${item.id}">🗑️ Hapus</button>
            </td>
          `;
          cartTable.appendChild(row);
        });
      }

      document.querySelector(".ringkasan-total").textContent = `Rp ${total.toFixed(3)}`;
      attachEvents();
    }

    function attachEvents() {
      // Update qty
      document.querySelectorAll('.qty-input').forEach(input => {
        input.addEventListener('change', (e) => {
          const newQty = parseInt(e.target.value);
          const id = parseInt(e.target.dataset.id);
          const index = cartData.findIndex(item => item.id === id);
          if (index > -1 && newQty >= 1) {
            cartData[index].qty = newQty;
            localStorage.setItem("cart", JSON.stringify(cartData));
            renderCart();
          }
        });
      });

      // Hapus item
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(e.target.dataset.id);
          cartData = cartData.filter(item => item.id !== id);
          localStorage.setItem("cart", JSON.stringify(cartData));
          renderCart();
        });
      });
    }

    renderCart();
  </script>

</body>
</html>
